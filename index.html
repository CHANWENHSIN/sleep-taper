<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
label {
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}
button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}
.delete-btn {
  width: auto;
  padding: 4px 8px;
  margin-left: 8px;
  background: #e53935;
  font-size: 12px;
}
.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
ul {
  padding-left: 18px;
}
li {
  margin-bottom: 8px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
  <label>記錄日期：</label>
  <input type="date" id="date"><br><br>

  <label>劑量：</label>
  <select id="dose">
    <option value="0.5">0.5</option>
    <option value="0.375">0.375</option>
    <option value="0.25">0.25</option>
    <option value="0.125">0.125</option>
    <option value="0">0</option>
  </select><br><br>

  <label>入睡時間（分鐘）：</label>
  <input type="number" id="latency" min="0"><br><br>

  <label>半夜醒來：</label>
  <select id="wake">
    <option value="0">0次</option>
    <option value="1">1次</option>
    <option value="2">2次以上</option>
  </select><br><br>

  <label>起床精神（1~5）：</label>
  <input type="number" id="energy" min="1" max="5" value="3"><br><br>

  <label>
    <input type="checkbox" id="supplement" style="width:auto;">
    有吃彰蜆活力
  </label><br><br>

  <label>咖啡：</label>
  <select id="coffee">
    <option value="">無</option>
    <option value="早上">早上</option>
    <option value="下午">下午</option>
    <option value="晚上">晚上</option>
  </select><br><br>

  <button onclick="saveLog()">儲存</button>
</div>

<div class="card">
  <h3>🧭 決策建議</h3>
  <div id="result" class="result"></div>
</div>

<div class="card">
  <h3>📊 分析結果</h3>
  <div id="analysis"></div>
</div>

<div class="card">
  <h3>📋 歷史紀錄</h3>
  <ul id="history"></ul>
</div>

<script>
const STORAGE_KEY = "sleepLogs";
let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

logs = logs.map(l => ({
  date: l.date,
  dose: Number(l.dose),
  latency: Number(l.latency),
  wake: Number(l.wake),
  energy: Number(l.energy),
  supplement: Boolean(l.supplement),
  coffee: l.coffee || ""
})).filter(l => l.date);

logs.sort((a,b) => new Date(a.date) - new Date(b.date));
localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  let input = document.getElementById("date");
  if (!input.value) input.value = `${yyyy}-${mm}-${dd}`;
}

function isStable(l) {
  return l.latency <= 30 && l.wake === 0 && l.energy >= 3;
}

function dayDiff(a, b) {
  return (new Date(b) - new Date(a)) / (1000*60*60*24);
}

function getContinuousSameDose() {
  let result = [];
  let last = logs[logs.length-1];
  if (!last) return result;

  result.unshift(last);

  for (let i = logs.length-2; i >= 0; i--) {
    let prev = logs[i];
    let curr = result[0];

    if (prev.dose !== last.dose) break;
    if (dayDiff(prev.date, curr.date) !== 1) break;

    result.unshift(prev);
  }
  return result;
}

function evaluate() {
  let result = document.getElementById("result");

  if (logs.length < 5) {
    result.innerHTML = `🟡 先累積資料（目前 ${logs.length} 天）`;
    result.className = "result warn";
    return;
  }

  let records = getContinuousSameDose();

  if (records.length < 5) {
    result.innerHTML = `🟡 同劑量觀察不足（${records.length}/5天）`;
    result.className = "result warn";
    return;
  }

  let last7 = records.slice(-7);

  let stableDays = last7.filter(isStable).length;
  let maxStreak = 0, cur = 0;

  last7.forEach(l=>{
    if(isStable(l)){ cur++; maxStreak=Math.max(maxStreak,cur); }
    else cur=0;
  });

  let hasNightCoffee = last7.some(l=>l.coffee==="晚上");
  let hasSupplement = last7.some(l=>l.supplement);

  if (hasNightCoffee || hasSupplement) {
    result.innerHTML = `🟡 有干擾因素（晚上咖啡/彰蜆），建議維持`;
    result.className = "result warn";
    return;
  }

  if (stableDays < last7.length - 1) {
    result.innerHTML = `🔴 穩定度不足（${stableDays}/${last7.length}天穩定）`;
    result.className = "result bad";
    return;
  }

  if (maxStreak < 3) {
    result.innerHTML = `🟡 尚未連續穩定3天`;
    result.className = "result warn";
    return;
  }

  let nextMap = {0.5:0.375,0.375:0.25,0.25:0.125,0.125:0};
  let next = nextMap[records[records.length-1].dose];

  result.innerHTML = `🟢 可以降藥 → ${records[records.length-1].dose} → ${next}`;
  result.className = "result good";
}

function saveLog() {
  let date = dateInput.value;
  if (logs.some(l=>l.date===date)){
    alert("當天已存在"); return;
  }

  logs.push({
    date,
    dose:parseFloat(dose.value),
    latency:parseInt(latency.value),
    wake:parseInt(wake.value),
    energy:parseInt(energy.value),
    supplement:supplement.checked,
    coffee:coffee.value
  });

  logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

  evaluate();
  renderHistory();
}

function deleteLog(i){
  if(!confirm("刪除?")) return;
  logs.splice(i,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));
  renderHistory();
  evaluate();
}

function renderHistory(){
  history.innerHTML="";
  logs.slice().reverse().forEach(l=>{
    let idx = logs.findIndex(x=>x.date===l.date);
    let li=document.createElement("li");
    li.innerHTML=
    `${l.date}｜${l.dose}｜入睡${l.latency}｜醒${l.wake}｜精神${l.energy}`
    +(l.supplement?"｜彰蜆":"")
    +(l.coffee?`｜咖啡:${l.coffee}`:"")
    +` <button class="delete-btn" onclick="deleteLog(${idx})">刪</button>`;
    history.appendChild(li);
  });
}

window.onload=function(){
  setDefaultDate();
  renderHistory();
  evaluate();
};
</script>

</body>
</html>
