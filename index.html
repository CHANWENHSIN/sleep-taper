<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
label {
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}
button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}
.delete-btn {
  width: auto;
  padding: 4px 8px;
  margin-left: 8px;
  background: #e53935;
  font-size: 12px;
}
.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
ul {
  padding-left: 18px;
}
li {
  margin-bottom: 8px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
  <label>記錄日期：</label>
  <input type="date" id="date"><br><br>

  <label>劑量：</label>
  <select id="dose">
    <option value="0.5">0.5</option>
    <option value="0.375">0.375</option>
    <option value="0.25">0.25</option>
    <option value="0.125">0.125</option>
    <option value="0">0</option>
  </select><br><br>

  <label>入睡時間（分鐘）：</label>
  <input type="number" id="latency" min="0"><br><br>

  <label>半夜醒來：</label>
  <select id="wake">
    <option value="0">0次</option>
    <option value="1">1次</option>
    <option value="2">2次以上</option>
  </select><br><br>

  <label>起床精神（1~5）：</label>
  <input type="number" id="energy" min="1" max="5" value="3"><br><br>

  <label>
    <input type="checkbox" id="supplement" style="width:auto;">
    有吃彰蜆活力
  </label><br><br>

  <label>咖啡：</label>
  <select id="coffee">
    <option value="">無</option>
    <option value="早上">早上</option>
    <option value="下午">下午</option>
    <option value="晚上">晚上</option>
  </select><br><br>

  <label>週期狀態：</label>
  <select id="cycleStatus">
    <option value="normal">平常</option>
    <option value="before_period">生理期前</option>
    <option value="during_period">生理期中</option>
    <option value="after_period">生理期後</option>
  </select><br><br>

  <button onclick="saveLog()">儲存</button>
</div>

<div class="card">
  <h3>🧭 決策建議</h3>
  <div id="result" class="result"></div>
</div>

<div class="card">
  <h3>📊 分析結果</h3>
  <div id="analysis"></div>
</div>

<div class="card">
  <h3>📋 歷史紀錄</h3>
  <ul id="history"></ul>
</div>

<script>
const STORAGE_KEY = "sleepLogs";
let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

logs = logs.map(l => ({
  date: l.date,
  dose: Number(l.dose),
  latency: Number(l.latency),
  wake: Number(l.wake),
  energy: Number(l.energy),
  supplement: Boolean(l.supplement),
  coffee: l.coffee || "",
  cycleStatus: l.cycleStatus || "normal"
})).filter(l => l.date);

logs.sort((a,b) => new Date(a.date) - new Date(b.date));
localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  document.getElementById("date").value = `${yyyy}-${mm}-${dd}`;
}

/*
  睡眠穩定判斷：
  這裡判斷的是「目前劑量下睡眠是否穩定」，
  不是代表自然睡眠能力已完全恢復。
*/
function isStable(l) {
  return l.latency <= 30 && l.wake <= 1 && l.energy >= 3;
}

/*
  睡眠品質分級：
  A級：很好
  B級：穩定
  C級：普通
  D級：不穩
*/
function getSleepQualityLevel(l) {
  if (l.latency <= 15 && l.wake <= 1 && l.energy >= 4) {
    return "A";
  }

  if (l.latency <= 30 && l.wake <= 1 && l.energy >= 3) {
    return "B";
  }

  if (l.latency <= 45 && l.wake <= 2 && l.energy >= 2) {
    return "C";
  }

  return "D";
}

function getSleepQualityScore(l) {
  const level = getSleepQualityLevel(l);

  if (level === "A") return 3;
  if (level === "B") return 2;
  if (level === "C") return 1;
  return 0;
}

/*
  明顯不穩定條件：
  因目前欄位只有「2次以上」，無法區分 2 次或 3 次，
  所以只要選到 2次以上，就先視為需要保守處理。
*/
function isPoorSleep(l) {
  return l.latency > 45 || l.wake >= 2 || l.energy <= 1;
}

/*
  干擾因子不再直接阻擋，只作為扣分。
  早上咖啡不扣分。
  下午咖啡、晚上咖啡、彰蜆、生理期前/中，作為風險修正。
  扣分最多 -2，避免人生正常波動導致永遠不能進入評估。
*/
function getInterferencePenalty(records) {
  let penalty = 0;

  if (records.some(l => l.coffee === "下午")) {
    penalty += 1;
  }

  if (records.some(l => l.coffee === "晚上")) {
    penalty += 2;
  }

  if (records.some(l => l.supplement)) {
    penalty += 1;
  }

  if (records.some(l => l.cycleStatus === "before_period")) {
    penalty += 1;
  }

  if (records.some(l => l.cycleStatus === "during_period")) {
    penalty += 1;
  }

  return Math.min(penalty, 2);
}

function getInterferenceText(records) {
  let items = [];

  if (records.some(l => l.coffee === "下午")) {
    items.push("下午咖啡");
  }

  if (records.some(l => l.coffee === "晚上")) {
    items.push("晚上咖啡");
  }

  if (records.some(l => l.supplement)) {
    items.push("彰蜆活力");
  }

  if (records.some(l => l.cycleStatus === "before_period")) {
    items.push("生理期前");
  }

  if (records.some(l => l.cycleStatus === "during_period")) {
    items.push("生理期中");
  }

  return items;
}

function dayDiff(a,b){
  return (new Date(b) - new Date(a)) / (1000*60*60*24);
}

function getContinuousSameDose(){
  let result=[];
  let last=logs[logs.length-1];
  if(!last) return result;

  result.unshift(last);

  for(let i=logs.length-2;i>=0;i--){
    let prev=logs[i];
    let curr=result[0];

    if(prev.dose!==last.dose) break;
    if(dayDiff(prev.date,curr.date)!==1) break;

    result.unshift(prev);
  }
  return result;
}

function evaluate(){
  let resultDiv=document.getElementById("result");

  if(logs.length<5){
    resultDiv.innerHTML=`🟡 先累積資料（${logs.length}天）`;
    resultDiv.className="result warn";
    return;
  }

  let records=getContinuousSameDose();

  if(records.length<5){
    resultDiv.innerHTML=`🟡 同劑量不足（${records.length}/5）`;
    resultDiv.className="result warn";
    return;
  }

  let recent=records.slice(-7);
  let latest=recent[recent.length-1];

  let stableDays=recent.filter(isStable).length;
  let poorDays=recent.filter(isPoorSleep).length;

  let maxStreak=0,cur=0;

  recent.forEach(l=>{
    if(isStable(l)){
      cur++;
      maxStreak=Math.max(maxStreak,cur);
    } else {
      cur=0;
    }
  });

  let lastTwo=recent.slice(-2);
  let lastTwoPoor=lastTwo.length === 2 && lastTwo.every(isPoorSleep);

  /*
    強制保守條件：
    這些代表近期睡眠品質明顯不穩，
    不適合進入下一階段評估。
  */
  if(isPoorSleep(latest)){
    resultDiv.innerHTML=
      `🔴 近期睡眠不穩，暫不建議調整劑量<br>`+
      `目前建議：維持目前劑量並觀察`;
    resultDiv.className="result bad";
    return;
  }

  if(lastTwoPoor){
    resultDiv.innerHTML=
      `🔴 連續兩天睡眠品質變差，暫不建議調整劑量<br>`+
      `目前建議：維持目前劑量並觀察`;
    resultDiv.className="result bad";
    return;
  }

  if(stableDays < Math.ceil(recent.length * 0.7)){
    resultDiv.innerHTML=
      `🔴 穩定不足（${stableDays}/${recent.length}）<br>`+
      `目前建議：維持目前劑量並觀察`;
    resultDiv.className="result bad";
    return;
  }

  if(stableDays < recent.length - 1){
    resultDiv.innerHTML=
      `🟡 睡眠尚可，但穩定天數不足（${stableDays}/${recent.length}）<br>`+
      `目前建議：維持目前劑量再觀察`;
    resultDiv.className="result warn";
    return;
  }

  if(maxStreak < 3){
    resultDiv.innerHTML=
      `🟡 尚未連續穩定 3 天<br>`+
      `目前建議：維持目前劑量再觀察`;
    resultDiv.className="result warn";
    return;
  }

  let latestScore=getSleepQualityScore(latest);
  let interferencePenalty=getInterferencePenalty(recent);
  let interferenceItems=getInterferenceText(recent);

  let stabilityBonus=1;

  if(recent.length >= 7 && poorDays === 0 && stableDays >= recent.length - 1){
    stabilityBonus=2;
  }

  let decisionScore=latestScore + stabilityBonus - interferencePenalty;

  let nextMap={0.5:0.375,0.375:0.25,0.25:0.125,0.125:0};
  let currentDose=records[records.length-1].dose;
  let next=nextMap[currentDose];

  let interferenceNote="";

  if(interferenceItems.length>0){
    interferenceNote=`<br>備註：近期有 ${interferenceItems.join("、")}，已列入保守評估`;
  }

  if(next === undefined){
    resultDiv.innerHTML=
      `🟢 目前已是最低紀錄劑量<br>`+
      `睡眠狀態穩定，請依醫師建議持續追蹤`+
      interferenceNote;
    resultDiv.className="result good";
    return;
  }

  if(decisionScore >= 4){
    resultDiv.innerHTML=
      `🟢 目前劑量下睡眠穩定<br>`+
      `可與醫師討論是否進入下一階段：${currentDose} → ${next}`+
      interferenceNote;
    resultDiv.className="result good";
    return;
  }

  if(decisionScore >= 2){
    resultDiv.innerHTML=
      `🟡 睡眠大致穩定，但仍建議保守觀察<br>`+
      `目前建議：維持 ${currentDose}，再觀察 3～7 天`+
      interferenceNote;
    resultDiv.className="result warn";
    return;
  }

  resultDiv.innerHTML=
    `🔴 近期條件不足，暫不建議調整劑量<br>`+
    `目前建議：維持目前劑量並觀察`+
    interferenceNote;
  resultDiv.className="result bad";
}

function saveLog(){
  let date=document.getElementById("date").value;

  if(logs.some(l=>l.date===date)){
    alert("當天已存在");return;
  }

  logs.push({
    date,
    dose:parseFloat(dose.value),
    latency:parseInt(latency.value),
    wake:parseInt(wake.value),
    energy:parseInt(energy.value),
    supplement:supplement.checked,
    coffee:coffee.value,
    cycleStatus:cycleStatus.value
  });

  logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

  renderHistory();
  evaluate();
  analyze();
}

function deleteLog(i){
  if(!confirm("刪除?"))return;
  logs.splice(i,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));
  renderHistory();
  evaluate();
  analyze();
}

function getCycleText(value){
  const map={
    normal:"平常",
    before_period:"生理期前",
    during_period:"生理期中",
    after_period:"生理期後"
  };
  return map[value] || "平常";
}

function renderHistory(){
  const historyList=document.getElementById("history");
  historyList.innerHTML="";

  if(logs.length===0){
    historyList.innerHTML="<li>尚無紀錄</li>";
    return;
  }

  logs.slice().reverse().forEach(l=>{
    let idx=logs.findIndex(x=>x.date===l.date);
    let li=document.createElement("li");

    li.innerHTML=
    `${l.date}｜${l.dose}｜入睡${l.latency}｜醒${l.wake}｜精神${l.energy}`
    +(l.supplement?"｜彰蜆":"")
    +(l.coffee?`｜咖啡:${l.coffee}`:"")
    +`｜週期:${getCycleText(l.cycleStatus)}`
    +` <button class="delete-btn" onclick="deleteLog(${idx})">刪</button>`;

    historyList.appendChild(li);
  });
}

function analyze(){
  let analysis=document.getElementById("analysis");

  if(logs.length<3){
    analysis.innerHTML="目前資料太少，至少 3 筆後才會開始分析。";
    return;
  }

  let before=logs.filter(l=>l.cycleStatus==="before_period");
  let normal=logs.filter(l=>l.cycleStatus==="normal");

  analysis.innerHTML=
    `生理期前紀錄：${before.length} 筆<br>`+
    `平常紀錄：${normal.length} 筆<br>`+
    `之後可用來比較週期對睡眠的影響。`;
}

window.onload=function(){
  setDefaultDate();
  renderHistory();
  evaluate();
  analyze();
};
</script>

</body>
</html>
