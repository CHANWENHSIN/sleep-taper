<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
label {
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}
button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}
.delete-btn {
  width: auto;
  padding: 5px 10px;
  margin-left: 0;
  background: #e53935;
  font-size: 12px;
  border-radius: 8px;
}
.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.summary-box {
  background: #f8f8f8;
  border-radius: 10px;
  padding: 12px;
  line-height: 1.5;
}
.summary-title {
  font-weight: bold;
  margin-bottom: 4px;
}
.summary-main {
  font-size: 22px;
  font-weight: bold;
}
.summary-sub {
  color: #555;
  font-size: 14px;
}
.compact-line {
  line-height: 1.7;
  margin-bottom: 6px;
}
details {
  margin-top: 12px;
  border-top: 1px solid #eee;
  padding-top: 10px;
}
summary {
  cursor: pointer;
  font-weight: bold;
  color: #444;
}
.detail-content {
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.7;
  color: #333;
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 13px;
  margin-left: 4px;
  background: #eee;
}
.tag-good { background: #e8f5e9; color: #2e7d32; }
.tag-warn { background: #fff8e1; color: #f57f17; }
.tag-bad { background: #ffebee; color: #c62828; }

.chart-wrap {
  width: 100%;
  height: 230px;
  position: relative;
}
#qualityChart {
  width: 100%;
  height: 230px;
  display: block;
}
.chart-note {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  margin-top: 8px;
}

/* 歷史紀錄表格 */
.history-table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 8px;
}

.history-table {
  width: 100%;
  min-width: 680px;
  border-collapse: collapse;
  font-size: 14px;
  background: white;
}

.history-table th {
  background: #f7f7f7;
  color: #333;
  font-weight: bold;
  padding: 10px 8px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  white-space: nowrap;
}

.history-table td {
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  vertical-align: top;
  white-space: nowrap;
}

.history-table tr:nth-child(even) {
  background: #fcfcfc;
}

.history-note {
  white-space: normal;
  line-height: 1.5;
  min-width: 130px;
}

.history-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  margin-right: 4px;
  margin-bottom: 4px;
  background: #f0f0f0;
}

.badge-period {
  background: #fce4ec;
  color: #ad1457;
}

.badge-coffee {
  background: #fff3e0;
  color: #ef6c00;
}

.badge-supplement {
  background: #ede7f6;
  color: #5e35b1;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
  <label>記錄日期：</label>
  <input type="date" id="date"><br><br>

  <label>劑量：</label>
  <select id="dose">
    <option value="0.5">0.5</option>
    <option value="0.375">0.375</option>
    <option value="0.25">0.25</option>
    <option value="0.125">0.125</option>
    <option value="0">0</option>
  </select><br><br>

  <label>入睡時間（分鐘）：</label>
  <input type="number" id="latency" min="0"><br><br>

  <label>半夜醒來：</label>
  <select id="wake">
    <option value="0">0次</option>
    <option value="1">1次</option>
    <option value="2">2次以上</option>
  </select><br><br>

  <label>起床精神（1~5）：</label>
  <input type="number" id="energy" min="1" max="5" value="3"><br><br>

  <label>
    <input type="checkbox" id="supplement" style="width:auto;">
    有吃彰蜆活力
  </label><br><br>

  <label>咖啡：</label>
  <select id="coffee">
    <option value="">無</option>
    <option value="早上">早上</option>
    <option value="下午">下午</option>
    <option value="晚上">晚上</option>
  </select><br><br>

  <label>週期狀態：</label>
  <select id="cycleStatus">
    <option value="normal">平常</option>
    <option value="before_period">生理期前</option>
    <option value="during_period">生理期中</option>
    <option value="after_period">生理期後</option>
  </select><br><br>

  <button onclick="saveLog()">儲存</button>
</div>

<div class="card">
  <h3>🧭 決策建議</h3>
  <div id="result" class="result"></div>
</div>

<div class="card">
  <h3>📈 睡眠品質趨勢</h3>
  <div class="chart-wrap">
    <canvas id="qualityChart"></canvas>
  </div>
  <div id="qualityChartNote" class="chart-note"></div>
</div>

<div class="card">
  <h3>📊 分析結果</h3>
  <div id="analysis"></div>
</div>

<div class="card">
  <h3>📋 歷史紀錄</h3>
  <div class="history-table-wrap">
    <table class="history-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>劑量</th>
          <th>入睡</th>
          <th>夜醒</th>
          <th>精神</th>
          <th>備註</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>

<script>
const STORAGE_KEY = "sleepLogs";
let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

logs = logs.map(l => ({
  date: l.date,
  dose: Number(l.dose),
  latency: Number(l.latency),
  wake: Number(l.wake),
  energy: Number(l.energy),
  supplement: Boolean(l.supplement),
  coffee: l.coffee || "",
  cycleStatus: l.cycleStatus || "normal"
})).filter(l => l.date);

logs.sort((a,b) => new Date(a.date) - new Date(b.date));
localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  document.getElementById("date").value = `${yyyy}-${mm}-${dd}`;
}

function isStable(l) {
  return l.latency <= 30 && l.wake <= 1 && l.energy >= 3;
}

function getSleepQualityLevel(l) {
  if (l.latency <= 15 && l.wake <= 1 && l.energy >= 4) return "A";
  if (l.latency <= 30 && l.wake <= 1 && l.energy >= 3) return "B";
  if (l.latency <= 45 && l.wake <= 2 && l.energy >= 2) return "C";
  return "D";
}

function getSleepQualityScore(l) {
  const level = getSleepQualityLevel(l);
  if (level === "A") return 3;
  if (level === "B") return 2;
  if (level === "C") return 1;
  return 0;
}

function getQualityScore100(l, groupRecords){
  let wakeScore = 0;
  if(l.wake === 0) wakeScore = 40;
  else if(l.wake === 1) wakeScore = 26;
  else wakeScore = 8;

  let energyScore = Math.max(0, Math.min(30, (l.energy / 5) * 30));

  let latencyScore = 0;
  if(l.latency <= 15) latencyScore = 20;
  else if(l.latency <= 30) latencyScore = 15;
  else if(l.latency <= 45) latencyScore = 8;
  else latencyScore = 2;

  let stabilityScore = 0;
  if(groupRecords && groupRecords.length >= 3){
    let stableCount = groupRecords.filter(isStable).length;
    stabilityScore = Math.round((stableCount / groupRecords.length) * 10);
  } else {
    stabilityScore = isStable(l) ? 7 : 3;
  }

  return Math.round(wakeScore + energyScore + latencyScore + stabilityScore);
}

function getRecordInterference(l){
  let items = [];
  let score = 0;

  if(l.coffee === "下午"){
    items.push("下午咖啡");
    score += 1;
  }

  if(l.coffee === "晚上"){
    items.push("晚上咖啡");
    score += 2;
  }

  if(l.supplement){
    items.push("彰蜆活力");
    score += 2;
  }

  if(l.cycleStatus === "before_period"){
    items.push("生理期前");
    score += 1;
  }

  if(l.cycleStatus === "during_period"){
    items.push("生理期中");
    score += 2;
  }

  if(l.cycleStatus === "after_period"){
    items.push("生理期後");
    score += 1;
  }

  let level = "低";
  if(score >= 3) level = "高";
  else if(score >= 1) level = "中";

  return {
    score,
    level,
    items,
    isHigh: score >= 3 || l.cycleStatus === "during_period" || l.coffee === "晚上" || l.supplement
  };
}

function isValidTaperSample(l){
  return !getRecordInterference(l).isHigh;
}

function avg(records, field){
  if(!records.length) return 0;
  return records.reduce((sum, l) => sum + Number(l[field] || 0), 0) / records.length;
}

function getRecentRecords(days){
  return logs.slice(-days);
}

function formatNumber(n, digits=1){
  return Number(n).toFixed(digits);
}

function getGroupStats(records){
  if(!records.length) return null;

  let qualityScores = records.map(l => getQualityScore100(l, records));
  let validCount = records.filter(isValidTaperSample).length;
  let highInterferenceCount = records.filter(l => getRecordInterference(l).isHigh).length;
  let conservativeCount = records.filter(l => !isStable(l) || getRecordInterference(l).isHigh).length;

  return {
    count: records.length,
    avgLatency: avg(records, "latency"),
    avgWake: avg(records, "wake"),
    avgEnergy: avg(records, "energy"),
    avgQuality: qualityScores.reduce((a,b) => a+b, 0) / qualityScores.length,
    stableCount: records.filter(isStable).length,
    poorCount: records.filter(isPoorSleep).length,
    validCount,
    highInterferenceCount,
    conservativeRate: conservativeCount / records.length
  };
}

function isPoorSleep(l) {
  return l.latency > 45 || l.wake >= 2 || l.energy <= 1;
}

function getInterferencePenalty(records) {
  let penalty = 0;

  if (records.some(l => l.coffee === "下午")) penalty += 1;
  if (records.some(l => l.coffee === "晚上")) penalty += 2;
  if (records.some(l => l.supplement)) penalty += 1;
  if (records.some(l => l.cycleStatus === "before_period")) penalty += 1;
  if (records.some(l => l.cycleStatus === "during_period")) penalty += 1;

  return Math.min(penalty, 2);
}

function getInterferenceText(records) {
  let items = [];

  if (records.some(l => l.coffee === "下午")) items.push("下午咖啡");
  if (records.some(l => l.coffee === "晚上")) items.push("晚上咖啡");
  if (records.some(l => l.supplement)) items.push("彰蜆活力");
  if (records.some(l => l.cycleStatus === "before_period")) items.push("生理期前");
  if (records.some(l => l.cycleStatus === "during_period")) items.push("生理期中");

  return items;
}

function dayDiff(a,b){
  return (new Date(b) - new Date(a)) / (1000*60*60*24);
}

function getContinuousSameDose(){
  let result=[];
  let last=logs[logs.length-1];
  if(!last) return result;

  result.unshift(last);

  for(let i=logs.length-2;i>=0;i--){
    let prev=logs[i];
    let curr=result[0];

    if(prev.dose!==last.dose) break;
    if(dayDiff(prev.date,curr.date)!==1) break;

    result.unshift(prev);
  }
  return result;
}

function evaluate(){
  let resultDiv=document.getElementById("result");

  if(logs.length<5){
    resultDiv.innerHTML=`🟡 先累積資料（${logs.length}天）`;
    resultDiv.className="result warn";
    return;
  }

  let records=getContinuousSameDose();

  if(records.length<5){
    resultDiv.innerHTML=`🟡 同劑量不足（${records.length}/5）`;
    resultDiv.className="result warn";
    return;
  }

  let recent=records.slice(-7);
  let latest=recent[recent.length-1];

  let stableDays=recent.filter(isStable).length;
  let poorDays=recent.filter(isPoorSleep).length;
  let validSamples=recent.filter(isValidTaperSample);
  let latestInterference=getRecordInterference(latest);

  let maxStreak=0,cur=0;

  recent.forEach(l=>{
    if(isStable(l) && isValidTaperSample(l)){
      cur++;
      maxStreak=Math.max(maxStreak,cur);
    } else {
      cur=0;
    }
  });

  let lastTwo=recent.slice(-2);
  let lastTwoPoor=lastTwo.length === 2 && lastTwo.every(isPoorSleep);

  let interferenceItems=getInterferenceText(recent);
  let interferenceNote="";

  if(interferenceItems.length>0){
    interferenceNote=`<br>備註：近期有 ${interferenceItems.join("、")}，已列入保守評估`;
  }

  if(latestInterference.isHigh){
    resultDiv.innerHTML=
      `🟡 最新紀錄屬於高干擾日（${latestInterference.items.join("、")}）<br>`+
      `目前建議：先維持目前劑量，等非高干擾日再判斷`+
      interferenceNote;
    resultDiv.className="result warn";
    return;
  }

  if(isPoorSleep(latest)){
    resultDiv.innerHTML=
      `🔴 近期睡眠不穩，暫不建議調整劑量<br>`+
      `目前建議：維持目前劑量並觀察`;
    resultDiv.className="result bad";
    return;
  }

  if(lastTwoPoor){
    resultDiv.innerHTML=
      `🔴 連續兩天睡眠品質變差，暫不建議調整劑量<br>`+
      `目前建議：維持目前劑量並觀察`;
    resultDiv.className="result bad";
    return;
  }

  if(validSamples.length < 5){
    resultDiv.innerHTML=
      `🟡 可用於降藥判斷的有效樣本不足（${validSamples.length}/5）<br>`+
      `目前建議：維持目前劑量，繼續累積非高干擾日資料`+
      interferenceNote;
    resultDiv.className="result warn";
    return;
  }

  let validRecent=validSamples.slice(-7);
  let validStableDays=validRecent.filter(isStable).length;
  let validPoorDays=validRecent.filter(isPoorSleep).length;
  let avgQuality=validRecent.reduce((sum,l)=>sum+getQualityScore100(l, validRecent),0)/validRecent.length;

  if(validStableDays < Math.ceil(validRecent.length * 0.75)){
    resultDiv.innerHTML=
      `🔴 有效樣本穩定不足（${validStableDays}/${validRecent.length}）<br>`+
      `目前建議：維持目前劑量並觀察`+
      interferenceNote;
    resultDiv.className="result bad";
    return;
  }

  if(validPoorDays > 0){
    resultDiv.innerHTML=
      `🟡 有效樣本中仍有不穩紀錄<br>`+
      `目前建議：維持目前劑量再觀察 3～7 天`+
      interferenceNote;
    resultDiv.className="result warn";
    return;
  }

  if(maxStreak < 3){
    resultDiv.innerHTML=
      `🟡 尚未連續 3 天有效穩定樣本<br>`+
      `目前建議：維持目前劑量再觀察`;
    resultDiv.className="result warn";
    return;
  }

  let latestScore=getSleepQualityScore(latest);
  let interferencePenalty=getInterferencePenalty(recent);

  let stabilityBonus=1;

  if(recent.length >= 7 && poorDays === 0 && stableDays >= recent.length - 1){
    stabilityBonus=2;
  }

  let decisionScore=latestScore + stabilityBonus - interferencePenalty;

  if(avgQuality < 80){
    resultDiv.innerHTML=
      `🟡 睡眠大致穩定，但品質分數尚未達標（${formatNumber(avgQuality,0)}/100）<br>`+
      `目前建議：維持目前劑量再觀察 3～7 天`+
      interferenceNote;
    resultDiv.className="result warn";
    return;
  }

  let nextMap={0.5:0.375,0.375:0.25,0.25:0.125,0.125:0};
  let currentDose=records[records.length-1].dose;
  let next=nextMap[currentDose];

  if(next === undefined){
    resultDiv.innerHTML=
      `🟢 目前已是最低紀錄劑量<br>`+
      `睡眠狀態穩定，請依醫師建議持續追蹤`+
      interferenceNote;
    resultDiv.className="result good";
    return;
  }

  if(decisionScore >= 4){
    resultDiv.innerHTML=
      `🟢 目前劑量下睡眠穩定<br>`+
      `可與醫師討論是否進入下一階段：${currentDose} → ${next}`+
      interferenceNote;
    resultDiv.className="result good";
    return;
  }

  resultDiv.innerHTML=
    `🟡 睡眠接近穩定，但仍建議保守觀察<br>`+
    `目前建議：維持 ${currentDose}，再觀察 3～7 天`+
    interferenceNote;
  resultDiv.className="result warn";
}

function saveLog(){
  let date=document.getElementById("date").value;

  if(logs.some(l=>l.date===date)){
    alert("當天已存在");
    return;
  }

  logs.push({
    date,
    dose:parseFloat(dose.value),
    latency:parseInt(latency.value),
    wake:parseInt(wake.value),
    energy:parseInt(energy.value),
    supplement:supplement.checked,
    coffee:coffee.value,
    cycleStatus:cycleStatus.value
  });

  logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

  renderHistory();
  evaluate();
  renderQualityChart();
  analyze();
}

function deleteLog(i){
  if(!confirm("刪除?")) return;
  logs.splice(i,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));
  renderHistory();
  evaluate();
  renderQualityChart();
  analyze();
}

function getCycleText(value){
  const map={
    normal:"平常",
    before_period:"生理期前",
    during_period:"生理期中",
    after_period:"生理期後"
  };
  return map[value] || "平常";
}

function renderHistory(){
  const historyBody=document.getElementById("history");
  historyBody.innerHTML="";

  if(logs.length===0){
    historyBody.innerHTML=`
      <tr>
        <td colspan="7">尚無紀錄</td>
      </tr>
    `;
    return;
  }

  logs.slice().reverse().forEach(l=>{
    let idx=logs.findIndex(x=>x.date===l.date);
    let tr=document.createElement("tr");

    let notes="";

    if(l.supplement){
      notes += `<span class="history-badge badge-supplement">彰蜆</span>`;
    }

    if(l.coffee){
      notes += `<span class="history-badge badge-coffee">咖啡:${l.coffee}</span>`;
    }

    notes += `<span class="history-badge badge-period">${getCycleText(l.cycleStatus)}</span>`;

    tr.innerHTML=`
      <td>${l.date}</td>
      <td>${l.dose}</td>
      <td>${l.latency}分</td>
      <td>${l.wake}</td>
      <td>${l.energy}</td>
      <td class="history-note">${notes}</td>
      <td><button class="delete-btn" onclick="deleteLog(${idx})">刪</button></td>
    `;

    historyBody.appendChild(tr);
  });
}

function getTrendTag(stats){
  if(!stats) return {text:"資料不足", cls:"tag-warn"};
  if(stats.avgQuality >= 85 && stats.poorCount === 0 && stats.stableCount >= Math.ceil(stats.count * 0.8)){
    return {text:"穩定", cls:"tag-good"};
  }
  if(stats.poorCount > 0 || stats.avgQuality < 70){
    return {text:"需觀察", cls:"tag-bad"};
  }
  return {text:"普通", cls:"tag-warn"};
}

function getLatestJudgement(latest, recent7){
  let interference=getRecordInterference(latest);
  let quality=getQualityScore100(latest, recent7);

  if(interference.isHigh){
    return {
      title:"🟡 高干擾日",
      cls:"warn",
      quality,
      sampleText:"不列入降藥支持樣本",
      note: interference.items.length ? interference.items.join("、") : "高干擾因素"
    };
  }

  if(isPoorSleep(latest)){
    return {
      title:"🔴 睡眠不穩",
      cls:"bad",
      quality,
      sampleText:"不建議調整",
      note:"先觀察睡眠是否恢復穩定"
    };
  }

  if(isStable(latest)){
    return {
      title:"🟢 睡眠穩定",
      cls:"good",
      quality,
      sampleText:"有效穩定樣本",
      note:"可納入劑量穩定度判斷"
    };
  }

  return {
    title:"🟡 尚可但未穩",
    cls:"warn",
    quality,
    sampleText:"繼續觀察",
    note:"不是高干擾日，但條件還不夠穩"
  };
}

function renderQualityChart(){
  const canvas=document.getElementById("qualityChart");
  const note=document.getElementById("qualityChartNote");
  if(!canvas || !note) return;

  const ctx=canvas.getContext("2d");
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio || 1;
  const width=Math.max(300, rect.width || canvas.parentElement.clientWidth || 300);
  const height=230;

  canvas.width=width*dpr;
  canvas.height=height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);

  if(logs.length < 2){
    ctx.font="14px Arial";
    ctx.fillStyle="#777";
    ctx.fillText("至少 2 筆資料後顯示趨勢圖",20,40);
    note.innerHTML="資料不足，先繼續累積睡眠紀錄。";
    return;
  }

  const records=logs.slice(-30);
  const scores=records.map(l=>getQualityScore100(l, records));

  const padding={left:34,right:12,top:18,bottom:34};
  const chartW=width-padding.left-padding.right;
  const chartH=height-padding.top-padding.bottom;

  function x(i){
    if(records.length===1) return padding.left + chartW/2;
    return padding.left + (i/(records.length-1))*chartW;
  }

  function y(score){
    return padding.top + (100-score)/100*chartH;
  }

  ctx.fillStyle="#e8f5e9";
  ctx.fillRect(padding.left,padding.top,chartW,y(80)-padding.top);

  ctx.fillStyle="#fff8e1";
  ctx.fillRect(padding.left,y(80),chartW,y(70)-y(80));

  ctx.fillStyle="#ffebee";
  ctx.fillRect(padding.left,y(70),chartW,padding.top+chartH-y(70));

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=1;
  ctx.font="12px Arial";
  ctx.fillStyle="#666";

  [100,80,70,50,0].forEach(v=>{
    const yy=y(v);
    ctx.beginPath();
    ctx.moveTo(padding.left,yy);
    ctx.lineTo(padding.left+chartW,yy);
    ctx.stroke();
    ctx.fillText(String(v),4,yy+4);
  });

  ctx.strokeStyle="#4CAF50";
  ctx.lineWidth=2;
  ctx.beginPath();
  scores.forEach((score,i)=>{
    const xx=x(i);
    const yy=y(score);
    if(i===0) ctx.moveTo(xx,yy);
    else ctx.lineTo(xx,yy);
  });
  ctx.stroke();

  records.forEach((l,i)=>{
    const xx=x(i);
    const yy=y(scores[i]);
    const interference=getRecordInterference(l);
    ctx.beginPath();
    ctx.arc(xx,yy,4,0,Math.PI*2);
    ctx.fillStyle=interference.isHigh ? "#f57c00" : "#2e7d32";
    ctx.fill();
    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();
  });

  ctx.fillStyle="#666";
  ctx.font="12px Arial";
  const first=records[0].date.slice(5);
  const last=records[records.length-1].date.slice(5);
  ctx.fillText(first,padding.left,padding.top+chartH+22);
  const lastTextWidth=ctx.measureText(last).width;
  ctx.fillText(last,padding.left+chartW-lastTextWidth,padding.top+chartH+22);

  if(records.length>=7){
    const midIdx=Math.floor(records.length/2);
    const mid=records[midIdx].date.slice(5);
    const midWidth=ctx.measureText(mid).width;
    ctx.fillText(mid,x(midIdx)-midWidth/2,padding.top+chartH+22);
  }

  const latestScore=scores[scores.length-1];
  const avgScore=scores.reduce((a,b)=>a+b,0)/scores.length;
  const highCount=records.filter(l=>getRecordInterference(l).isHigh).length;

  let status="需觀察";
  if(avgScore>=85 && latestScore>=80) status="穩定";
  else if(avgScore<70 || latestScore<70) status="偏弱";

  note.innerHTML=
    `最近${records.length}筆品質平均 ${formatNumber(avgScore,0)}/100｜`+
    `最新 ${latestScore}/100｜高干擾 ${highCount} 筆｜狀態：${status}`;
}

function analyze(){
  let analysis=document.getElementById("analysis");

  if(logs.length<3){
    analysis.innerHTML="目前資料太少，至少 3 筆後才會開始分析。";
    return;
  }

  const groups=[
    {key:"normal", label:"平常"},
    {key:"before_period", label:"生理期前"},
    {key:"during_period", label:"生理期中"},
    {key:"after_period", label:"生理期後"}
  ];

  let recent7=getRecentRecords(7);
  let recent14=getRecentRecords(14);
  let s7=getGroupStats(recent7);
  let s14=getGroupStats(recent14);
  let latest=logs[logs.length-1];
  let latestInfo=getLatestJudgement(latest, recent7);
  let trendTag=getTrendTag(s7);

  let validTotal=logs.filter(isValidTaperSample).length;
  let highTotal=logs.filter(l=>getRecordInterference(l).isHigh).length;

  let html="";

  html += `<div class="summary-grid">`;
  html += `
    <div class="summary-box">
      <div class="summary-title">🧭 今日判定</div>
      <div class="summary-main ${latestInfo.cls}">${latestInfo.title}</div>
      <div class="summary-sub">品質 ${latestInfo.quality}/100｜${latestInfo.sampleText}</div>
      <div class="summary-sub">${latestInfo.note}</div>
    </div>`;

  if(s7){
    html += `
      <div class="summary-box">
        <div class="summary-title">📊 最近7筆</div>
        <div class="compact-line">品質 ${formatNumber(s7.avgQuality,0)}/100 <span class="tag ${trendTag.cls}">${trendTag.text}</span></div>
        <div class="summary-sub">穩定 ${s7.stableCount}/${s7.count}｜不穩 ${s7.poorCount}/${s7.count}｜有效樣本 ${s7.validCount}/${s7.count}</div>
      </div>`;
  }

  html += `
    <div class="summary-box">
      <div class="summary-title">🧪 分類品質</div>
      <div class="compact-line">總紀錄 ${logs.length} 筆｜有效 ${validTotal} 筆｜高干擾 ${highTotal} 筆</div>
      <div class="summary-sub">高干擾日會保留紀錄，但不直接支持降藥。</div>
    </div>`;
  html += `</div>`;

  html += `<details>
    <summary>展開詳細分析</summary>
    <div class="detail-content">`;

  html += `<strong>週期比較</strong><br>`;

  groups.forEach(g=>{
    let records=logs.filter(l=>l.cycleStatus===g.key);
    let s=getGroupStats(records);

    if(!s){
      html += `${g.label}：0 筆<br>`;
      return;
    }

    html +=
      `${g.label}：${s.count} 筆｜`+
      `平均入睡 ${formatNumber(s.avgLatency)} 分｜`+
      `平均夜醒 ${formatNumber(s.avgWake)} 次｜`+
      `平均精神 ${formatNumber(s.avgEnergy)}｜`+
      `品質 ${formatNumber(s.avgQuality,0)}/100｜`+
      `有效 ${s.validCount} 筆｜`+
      `高干擾 ${s.highInterferenceCount} 筆<br>`;
  });

  html += `<br><strong>近期趨勢</strong><br>`;

  if(s7){
    html +=
      `最近7筆：品質 ${formatNumber(s7.avgQuality,0)}/100｜`+
      `穩定 ${s7.stableCount}/${s7.count}｜`+
      `不穩 ${s7.poorCount}/${s7.count}｜`+
      `有效樣本 ${s7.validCount}/${s7.count}<br>`;
  }

  if(s14 && recent14.length > recent7.length){
    html +=
      `最近14筆：品質 ${formatNumber(s14.avgQuality,0)}/100｜`+
      `穩定 ${s14.stableCount}/${s14.count}｜`+
      `不穩 ${s14.poorCount}/${s14.count}｜`+
      `有效樣本 ${s14.validCount}/${s14.count}<br>`;
  }

  let latestInterference=getRecordInterference(latest);

  html += `<br><strong>最新紀錄判讀</strong><br>`;
  html +=
    `${latest.date}：品質 ${getQualityScore100(latest, recent7)}/100｜`+
    `干擾等級：${latestInterference.level}`;

  if(latestInterference.items.length){
    html += `（${latestInterference.items.join("、")}）`;
  }

  html += `<br>`;

  if(latestInterference.isHigh){
    html += `這筆屬於高干擾日：可用來觀察身體狀態，但不建議拿來支持降藥。`;
  } else if(isStable(latest)){
    html += `這筆屬於有效穩定樣本：可納入劑量穩定度判斷。`;
  } else {
    html += `這筆不是高干擾日，但睡眠條件尚未穩定，建議繼續觀察。`;
  }

  html += `<br><br><strong>判讀規則</strong><br>`;
  html += `首頁只顯示今日判定、最近7筆、分類品質；週期比較與細節放在這裡，避免手機版資訊太滿。`;

  html += `</div></details>`;

  analysis.innerHTML=html;
}

window.onload=function(){
  setDefaultDate();
  renderHistory();
  evaluate();
  renderQualityChart();
  analyze();
};

window.addEventListener("resize", renderQualityChart);
</script>
