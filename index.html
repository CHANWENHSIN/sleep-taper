<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}

.delete-btn {
  width: auto;
  padding: 5px 10px;
  background: #e53935;
  font-size: 12px;
  border-radius: 8px;
}

.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}

.good { color: green; }
.warn { color: orange; }
.bad { color: red; }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.summary-box {
  background: #f8f8f8;
  border-radius: 10px;
  padding: 12px;
  line-height: 1.5;
}

.summary-title {
  font-weight: bold;
  margin-bottom: 4px;
}

.summary-main {
  font-size: 22px;
  font-weight: bold;
}

.summary-sub {
  color: #555;
  font-size: 14px;
}

.compact-line {
  line-height: 1.7;
  margin-bottom: 6px;
}

details {
  margin-top: 12px;
  border-top: 1px solid #eee;
  padding-top: 10px;
}

summary {
  cursor: pointer;
  font-weight: bold;
  color: #444;
}

.detail-content {
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.7;
  color: #333;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 13px;
  margin-left: 4px;
  background: #eee;
}

.tag-good {
  background: #e8f5e9;
  color: #2e7d32;
}

.tag-warn {
  background: #fff8e1;
  color: #f57f17;
}

.tag-bad {
  background: #ffebee;
  color: #c62828;
}

.chart-wrap {
  width: 100%;
  height: 230px;
  position: relative;
}

#qualityChart {
  width: 100%;
  height: 230px;
  display: block;
}

.chart-note {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  margin-top: 8px;
}

.history-table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 8px;
}

.history-table {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
  font-size: 14px;
  background: white;
}

.history-table th {
  background: #f7f7f7;
  color: #333;
  font-weight: bold;
  padding: 10px 8px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  white-space: nowrap;
}

.history-table td {
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  vertical-align: top;
  white-space: nowrap;
}

.history-table tr:nth-child(even) {
  background: #fcfcfc;
}

.history-note {
  white-space: normal;
  line-height: 1.5;
  min-width: 170px;
}

.history-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  margin-right: 4px;
  margin-bottom: 4px;
}

.badge-period {
  background: #fce4ec;
  color: #ad1457;
}

.badge-coffee {
  background: #fff3e0;
  color: #ef6c00;
}

.badge-support {
  background: #e3f2fd;
  color: #1565c0;
}

.badge-iv {
  background: #e8f5e9;
  color: #2e7d32;
}

.badge-exercise {
  background: #ede7f6;
  color: #5e35b1;
}

.helper-text {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  margin-top: 6px;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">

<label>記錄日期：</label>
<input type="date" id="date"><br><br>

<label>劑量：</label>
<select id="dose">
  <option value="0.5">0.5</option>
  <option value="0.375">0.375</option>
  <option value="0.25">0.25</option>
  <option value="0.125">0.125</option>
  <option value="0">0</option>
</select><br><br>

<label>入睡時間（分鐘）：</label>
<input type="number" id="latency" min="0"><br><br>

<label>半夜醒來：</label>
<select id="wake">
  <option value="0">0次</option>
  <option value="1">1次</option>
  <option value="2">2次以上</option>
</select><br><br>

<label>起床精神（1~5）：</label>
<input type="number" id="energy" min="1" max="5" value="3"><br><br>

<label>
  <input type="checkbox" id="supplement" style="width:auto;">
  睡前有吃保肝＋濱松
</label>

<div class="helper-text">
營養師建議：睡前各一顆，作為放鬆／助眠支持因子。
</div>

<br>

<label>
  <input type="checkbox" id="ivTherapy" style="width:auto;">
  今天有打營養針
</label>

<div class="helper-text">
作為放鬆與恢復支持因子，會納入睡眠穩定度分析。
</div>

<br>

<label>運動：</label>

<select id="exercise">
  <option value="">無</option>
  <option value="walk">快走</option>
  <option value="pilates">皮拉提斯</option>
  <option value="bike">騎腳踏車</option>
</select>

<div class="helper-text">
運動會納入睡眠穩定度分析。
</div>

<br>

<label>咖啡：</label>
<select id="coffee">
  <option value="">無</option>
  <option value="早上">早上</option>
  <option value="下午">下午</option>
  <option value="晚上">晚上</option>
</select><br><br>

<label>週期狀態：</label>
<select id="cycleStatus">
  <option value="normal">平常</option>
  <option value="before_period">生理期前</option>
  <option value="during_period">生理期中</option>
  <option value="after_period">生理期後</option>
</select><br><br>

<button onclick="saveLog()">儲存</button>

</div>

<div class="card">
<h3>🧭 決策建議</h3>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>📈 睡眠品質趨勢</h3>

<div class="chart-wrap">
  <canvas id="qualityChart"></canvas>
</div>

<div id="qualityChartNote" class="chart-note"></div>
</div>

<div class="card">
<h3>📊 分析結果</h3>
<div id="analysis"></div>
</div>

<div class="card">
<h3>📋 歷史紀錄</h3>

<div class="history-table-wrap">

<table class="history-table">

<thead>
<tr>
  <th>日期</th>
  <th>劑量</th>
  <th>入睡</th>
  <th>夜醒</th>
  <th>精神</th>
  <th>備註</th>
  <th></th>
</tr>
</thead>

<tbody id="history"></tbody>

</table>

</div>

</div>

<script>

const STORAGE_KEY = "sleepLogs";

let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

logs = logs.map(l => ({
  date: l.date,
  dose: Number(l.dose),
  latency: Number(l.latency),
  wake: Number(l.wake),
  energy: Number(l.energy),
  supplement: Boolean(l.supplement),
  ivTherapy: Boolean(l.ivTherapy),
  exercise: l.exercise || "",
  coffee: l.coffee || "",
  cycleStatus: l.cycleStatus || "normal"
})).filter(l => l.date);

logs.sort((a,b) => new Date(a.date) - new Date(b.date));

localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

function setDefaultDate() {

  let d = new Date();

  d.setDate(d.getDate() - 1);

  document.getElementById("date").value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function isStable(l) {
  return l.latency <= 30 && l.wake <= 1 && l.energy >= 3;
}

function isPoorSleep(l) {
  return l.latency > 45 || l.wake >= 2 || l.energy <= 1;
}

function getSleepQualityLevel(l) {

  if (l.latency <= 15 && l.wake <= 1 && l.energy >= 4) return "A";
  if (l.latency <= 30 && l.wake <= 1 && l.energy >= 3) return "B";
  if (l.latency <= 45 && l.wake <= 2 && l.energy >= 2) return "C";

  return "D";
}

function getSleepQualityScore(l) {

  const level = getSleepQualityLevel(l);

  if (level === "A") return 3;
  if (level === "B") return 2;
  if (level === "C") return 1;

  return 0;
}

function getQualityScore100(l, groupRecords){

  let wakeScore = l.wake === 0 ? 40 : l.wake === 1 ? 26 : 8;

  let energyScore = Math.max(
    0,
    Math.min(30, (l.energy / 5) * 30)
  );

  let latencyScore = 0;

  if(l.latency <= 15) latencyScore = 20;
  else if(l.latency <= 30) latencyScore = 15;
  else if(l.latency <= 45) latencyScore = 8;
  else latencyScore = 2;

  let stabilityScore = 0;

  if(groupRecords && groupRecords.length >= 3){

    let stableCount = groupRecords.filter(isStable).length;

    stabilityScore = Math.round(
      (stableCount / groupRecords.length) * 10
    );

  } else {

    stabilityScore = isStable(l) ? 7 : 3;
  }

  return Math.round(
    wakeScore +
    energyScore +
    latencyScore +
    stabilityScore
  );
}

function getRecordInterference(l){

  let items = [];
  let score = 0;

  if(l.coffee === "下午"){
    items.push("下午咖啡");
    score += 1;
  }

  if(l.coffee === "晚上"){
    items.push("晚上咖啡");
    score += 2;
  }

  if(l.cycleStatus === "before_period"){
    items.push("生理期前");
    score += 1;
  }

  if(l.cycleStatus === "during_period"){
    items.push("生理期中");
    score += 2;
  }

  if(l.cycleStatus === "after_period"){
    items.push("生理期後");
    score += 1;
  }

  let level = "低";

  if(score >= 3) level = "高";
  else if(score >= 1) level = "中";

  return {
    score,
    level,
    items,
    isHigh:
      score >= 3 ||
      l.cycleStatus === "during_period" ||
      l.coffee === "晚上"
  };
}

function hasSleepSupport(l){
  return Boolean(l.supplement) || Boolean(l.ivTherapy);
}

function getSleepSupportBonus(records){

  let supportCount = records.filter(hasSleepSupport).length;

  if(records.length >= 5 && supportCount >= 3){
    return 1;
  }

  return 0;
}

function getExerciseText(value){

  const map = {
    walk: "快走",
    pilates: "皮拉提斯",
    bike: "騎腳踏車"
  };

  return map[value] || "無";
}

function getExerciseImpact(l){

  if(!l.exercise){
    return {
      type: "none",
      score: 0,
      text: "無"
    };
  }

  if(l.exercise === "walk"){
    return {
      type: "positive",
      score: 1,
      text: "快走"
    };
  }

  if(l.exercise === "bike"){
    return {
      type: "neutral",
      score: 0.5,
      text: "騎腳踏車"
    };
  }

  if(l.exercise === "pilates"){
    return {
      type: "fatigue",
      score: -0.5,
      text: "皮拉提斯"
    };
  }

  return {
    type: "none",
    score: 0,
    text: "無"
  };
}

function isValidTaperSample(l){
  return !getRecordInterference(l).isHigh;
}

function avg(records, field){

  if(!records.length) return 0;

  return records.reduce(
    (sum, l) => sum + Number(l[field] || 0),
    0
  ) / records.length;
}

function getRecentRecords(days){
  return logs.slice(-days);
}

function formatNumber(n, digits=1){
  return Number(n).toFixed(digits);
}

function dayDiff(a,b){
  return (new Date(b) - new Date(a)) / (1000*60*60*24);
}

function getContinuousSameDose(){

  let result=[];

  let last=logs[logs.length-1];

  if(!last) return result;

  result.unshift(last);

  for(let i=logs.length-2;i>=0;i--){

    let prev=logs[i];

    let curr=result[0];

    if(prev.dose!==last.dose) break;

    if(dayDiff(prev.date,curr.date)!==1) break;

    result.unshift(prev);
  }

  return result;
}

function evaluate(){

  let resultDiv=document.getElementById("result");

  if(logs.length<5){

    resultDiv.innerHTML=`🟡 先累積資料（${logs.length}天）`;

    resultDiv.className="result warn";

    return;
  }

  let records=getContinuousSameDose();

  if(records.length<5){

    resultDiv.innerHTML=`🟡 同劑量不足（${records.length}/5）`;

    resultDiv.className="result warn";

    return;
  }

  let recent=records.slice(-7);

  let latest=recent[recent.length-1];

  let stableDays=recent.filter(isStable).length;

  let poorDays=recent.filter(isPoorSleep).length;

  let validSamples=recent.filter(isValidTaperSample);

  let latestInterference=getRecordInterference(latest);

  let maxStreak=0,cur=0;

  recent.forEach(l=>{

    if(isStable(l) && isValidTaperSample(l)){

      cur++;

      maxStreak=Math.max(maxStreak,cur);

    } else {

      cur=0;
    }
  });

  let supportCount = recent.filter(hasSleepSupport).length;

  let supportText = "";

  if(supportCount > 0){

    supportText =
      `<br>恢復支持：最近 ${supportCount}/${recent.length} 天有保肝／濱松／營養針`;
  }

  if(latestInterference.isHigh){

    resultDiv.innerHTML =
      `🟡 最新紀錄屬於高干擾日（${latestInterference.items.join("、")}）<br>` +
      `目前建議：先維持目前劑量，等非高干擾日再判斷` +
      supportText;

    resultDiv.className="result warn";

    return;
  }

  if(isPoorSleep(latest)){

    resultDiv.innerHTML =
      `🔴 近期睡眠不穩，暫不建議調整劑量<br>` +
      `目前建議：維持目前劑量並觀察` +
      supportText;

    resultDiv.className="result bad";

    return;
  }

  let latestScore=getSleepQualityScore(latest);

  let interferencePenalty=getInterferencePenalty(recent);

  let supportBonus=getSleepSupportBonus(validSamples);

  let exerciseBonus = 0;

  validSamples.forEach(l=>{
    exerciseBonus += getExerciseImpact(l).score;
  });

  exerciseBonus = Math.max(
    -1,
    Math.min(1, exerciseBonus / 5)
  );

  let stabilityBonus=1;

  if(recent.length >= 7 &&
     poorDays === 0 &&
     stableDays >= recent.length - 1){

    stabilityBonus=2;
  }

  let decisionScore =
    latestScore +
    stabilityBonus +
    supportBonus +
    exerciseBonus -
    interferencePenalty;

  let nextMap={
    0.5:0.375,
    0.375:0.25,
    0.25:0.125,
    0.125:0
  };

  let currentDose=records[records.length-1].dose;

  let next=nextMap[currentDose];

  if(decisionScore >= 4){

    resultDiv.innerHTML =
      `🟢 目前劑量下睡眠穩定<br>` +
      `可與醫師討論是否進入下一階段：${currentDose} → ${next}` +
      supportText;

    resultDiv.className="result good";

    return;
  }

  resultDiv.innerHTML =
    `🟡 睡眠接近穩定，但仍建議保守觀察<br>` +
    `目前建議：維持 ${currentDose}，再觀察 3～7 天` +
    supportText;

  resultDiv.className="result warn";
}

function getInterferencePenalty(records){

  let penalty = 0;

  if (records.some(l => l.coffee === "下午")) penalty += 1;
  if (records.some(l => l.coffee === "晚上")) penalty += 2;
  if (records.some(l => l.cycleStatus === "before_period")) penalty += 1;
  if (records.some(l => l.cycleStatus === "during_period")) penalty += 1;

  return Math.min(penalty, 2);
}

function saveLog(){

  let date=document.getElementById("date").value;

  if(logs.some(l=>l.date===date)){

    alert("當天已存在");

    return;
  }

  logs.push({

    date,

    dose:parseFloat(dose.value),

    latency:parseInt(latency.value),

    wake:parseInt(wake.value),

    energy:parseInt(energy.value),

    supplement:supplement.checked,

    ivTherapy:ivTherapy.checked,

    exercise:exercise.value,

    coffee:coffee.value,

    cycleStatus:cycleStatus.value
  });

  logs.sort((a,b)=>new Date(a.date)-new Date(b.date));

  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

  renderHistory();

  evaluate();
}

function deleteLog(i){

  if(!confirm("刪除?")) return;

  logs.splice(i,1);

  localStorage.setItem(STORAGE_KEY,JSON.stringify(logs));

  renderHistory();

  evaluate();
}

function getCycleText(value){

  const map={
    normal:"平常",
    before_period:"生理期前",
    during_period:"生理期中",
    after_period:"生理期後"
  };

  return map[value] || "平常";
}

function renderHistory(){

  const historyBody=document.getElementById("history");

  historyBody.innerHTML="";

  if(logs.length===0){

    historyBody.innerHTML=`
      <tr>
        <td colspan="7">尚無紀錄</td>
      </tr>
    `;

    return;
  }

  logs.slice().reverse().forEach(l=>{

    let idx=logs.findIndex(x=>x.date===l.date);

    let tr=document.createElement("tr");

    let notes="";

    if(l.supplement){

      notes += `
        <span class="history-badge badge-support">
          保肝＋濱松
        </span>
      `;
    }

    if(l.ivTherapy){

      notes += `
        <span class="history-badge badge-iv">
          營養針
        </span>
      `;
    }

    if(l.exercise){

      notes += `
        <span class="history-badge badge-exercise">
          運動:${getExerciseText(l.exercise)}
        </span>
      `;
    }

    if(l.coffee){

      notes += `
        <span class="history-badge badge-coffee">
          咖啡:${l.coffee}
        </span>
      `;
    }

    notes += `
      <span class="history-badge badge-period">
        ${getCycleText(l.cycleStatus)}
      </span>
    `;

    tr.innerHTML=`
      <td>${l.date}</td>
      <td>${l.dose}</td>
      <td>${l.latency}分</td>
      <td>${l.wake}</td>
      <td>${l.energy}</td>
      <td class="history-note">${notes}</td>
      <td>
        <button class="delete-btn" onclick="deleteLog(${idx})">
          刪
        </button>
      </td>
    `;

    historyBody.appendChild(tr);
  });
}

window.onload=function(){

  setDefaultDate();

  renderHistory();

  evaluate();
};

</script>

</body>
</html>
