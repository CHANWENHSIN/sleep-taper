<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心（正式版）</title>

<style>
body { font-family: Arial; background: #f5f5f5; padding: 15px; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
button { padding: 10px; border:none; border-radius:8px; background:#4CAF50; color:white; width:100%; }
.delete-btn { background:red; width:auto; padding:3px 6px; margin-left:8px; }
.result { font-size:18px; font-weight:bold; text-align:center; }
.good{color:green;} .warn{color:orange;} .bad{color:red;}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
<label>日期</label>
<input type="date" id="date"><br><br>

<label>劑量</label>
<select id="dose">
<option value="0.5">0.5</option>
<option value="0.375">0.375</option>
<option value="0.25">0.25</option>
<option value="0.125">0.125</option>
<option value="0">0</option>
</select><br><br>

<label>入睡（分鐘）</label>
<input type="number" id="latency"><br><br>

<label>醒來</label>
<select id="wake">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2+</option>
</select><br><br>

<label>精神</label>
<input type="number" id="energy" min="1" max="5"><br><br>

<label><input type="checkbox" id="supplement"> 有吃彰蜆活力</label><br><br>

<label>咖啡</label>
<select id="coffee">
<option value="">無</option>
<option value="早上">早上</option>
<option value="下午">下午</option>
<option value="晚上">晚上</option>
</select><br><br>

<button onclick="saveLog()">儲存</button>
</div>

<div class="card">
<h3>🧭 決策</h3>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>📋 歷史</h3>
<ul id="history"></ul>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("sleepLogs")) || [];

// 預設昨天
window.onload = function(){
  let d=new Date();
  d.setDate(d.getDate()-1);
  let yyyy=d.getFullYear();
  let mm=String(d.getMonth()+1).padStart(2,'0');
  let dd=String(d.getDate()).padStart(2,'0');
  if(!date.value) date.value=`${yyyy}-${mm}-${dd}`;

  renderHistory();
  evaluate();
};

// 儲存
function saveLog(){
  let log={
    date:date.value,
    dose:parseFloat(dose.value),
    latency:parseInt(latency.value),
    wake:parseInt(wake.value),
    energy:parseInt(energy.value),
    supplement:supplement.checked,
    coffee:coffee.value
  };

  if(logs.some(l=>l.date===log.date)){
    alert("當天已存在");
    return;
  }

  logs.push(log);
  logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  localStorage.setItem("sleepLogs",JSON.stringify(logs));

  renderHistory();
  evaluate();
}

// 刪除
function deleteLog(i){
  if(!confirm("刪除？"))return;
  logs.splice(i,1);
  localStorage.setItem("sleepLogs",JSON.stringify(logs));
  renderHistory();
  evaluate();
}

// 判斷穩定
function isStable(l){
  return l.latency<=20 && l.wake<=1 && l.energy>=3;
}

// 核心：計算「連續穩定天數」
function getStreak(){
  if(logs.length===0) return {days:0, dose:null};

  let last=logs[logs.length-1];
  let streak=0;

  for(let i=logs.length-1;i>=0;i--){
    let curr=logs[i];
    let prev=logs[i-1];

    if(curr.dose!==last.dose) break;
    if(!isStable(curr)) break;

    // 日期連續判斷
    if(prev){
      let d1=new Date(curr.date);
      let d2=new Date(prev.date);
      let diff=(d1-d2)/(1000*60*60*24);
      if(diff!==1) break;
    }

    streak++;
  }

  return {days:streak, dose:last.dose};
}

// 決策
function evaluate(){
  let res=document.getElementById("result");

  if(logs.length<5){
    res.innerHTML=`🟡 資料不足（${logs.length}天）`;
    res.className="result warn";
    return;
  }

  let {days,dose}=getStreak();

  let lastLogs=logs.slice(-days);
  let hasBad=lastLogs.some(l=>l.coffee==="晚上"||l.supplement);

  let nextMap={0.5:0.375,0.375:0.25,0.25:0.125,0.125:0};
  let next=nextMap[dose];

  if(days>=5 && !hasBad){
    res.innerHTML=`🟢 可降藥（連續${days}天）<br>${dose} → ${next}`;
    res.className="result good";
  }else if(days>=5 && hasBad){
    res.innerHTML=`🟡 穩定但有干擾（連續${days}天）`;
    res.className="result warn";
  }else{
    res.innerHTML=`🔴 尚未穩定（目前連續${days}天）`;
    res.className="result bad";
  }
}

// 歷史
function renderHistory(){
  history.innerHTML="";
  logs.slice().reverse().forEach(l=>{
    let idx=logs.findIndex(x=>x.date===l.date);
    let li=document.createElement("li");
    li.innerHTML=
    `${l.date}｜${l.dose}｜入睡${l.latency}｜醒${l.wake}｜精神${l.energy}`
    +(l.supplement?"｜彰蜆":"")
    +(l.coffee?`｜咖啡:${l.coffee}`:"")
    +` <button class="delete-btn" onclick="deleteLog(${idx})">刪</button>`;
    history.appendChild(li);
  });
}
</script>

</body>
</html>
