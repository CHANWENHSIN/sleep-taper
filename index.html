<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戒安眠藥紀錄</title>
<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; }
.card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
h2 { margin-top: 0; }
button { padding: 10px; width: 100%; }
.result { font-size: 20px; font-weight: bold; }
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
</style>
</head>

<body>

<h2>💊 戒安眠藥紀錄</h2>

<div class="card">
<label>劑量：</label>
<select id="dose">
  <option value="0.5">0.5</option>
  <option value="0.375">0.375</option>
  <option value="0.25">0.25</option>
  <option value="0.125">0.125</option>
  <option value="0">0</option>
</select><br><br>

<label>入睡時間（分鐘）：</label>
<input type="number" id="latency"><br><br>

<label>半夜醒來：</label>
<select id="wake">
  <option value="0">0次</option>
  <option value="1">1次</option>
  <option value="2">2次以上</option>
</select><br><br>

<label>起床精神（1~5）：</label>
<input type="number" id="energy" min="1" max="5"><br><br>

<button onclick="saveLog()">儲存</button>
</div>

<div class="card">
<h3>系統判斷</h3>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>歷史紀錄</h3>
<ul id="history"></ul>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("sleepLogs")) || [];

function saveLog() {
  let dose = parseFloat(document.getElementById("dose").value);
  let latency = parseInt(document.getElementById("latency").value);
  let wake = parseInt(document.getElementById("wake").value);
  let energy = parseInt(document.getElementById("energy").value);

  let log = {
    date: new Date().toLocaleDateString(),
    dose,
    latency,
    wake,
    energy
  };

  logs.push(log);
  localStorage.setItem("sleepLogs", JSON.stringify(logs));

  evaluate();
  renderHistory();
}

function evaluate() {
  if (logs.length < 2) return;

  let last2 = logs.slice(-2);

  let ok = last2.every(l =>
    l.latency <= 20 &&
    l.wake <= 1 &&
    l.energy >= 3
  );

  let resultDiv = document.getElementById("result");

  if (ok) {
    resultDiv.innerHTML = "🟢 可以降藥";
    resultDiv.className = "result good";
  } else if (
    last2.some(l => l.energy <= 2)
  ) {
    resultDiv.innerHTML = "🔴 不穩定，先不要降";
    resultDiv.className = "result bad";
  } else {
    resultDiv.innerHTML = "🟡 維持目前劑量";
    resultDiv.className = "result warn";
  }
}

function renderHistory() {
  let ul = document.getElementById("history");
  ul.innerHTML = "";

  logs.slice().reverse().forEach(l => {
    let li = document.createElement("li");
    li.innerText = `${l.date}｜劑量:${l.dose}｜入睡:${l.latency}分｜醒:${l.wake}次｜精神:${l.energy}`;
    ul.appendChild(li);
  });
}

renderHistory();
evaluate();
</script>

</body>
</html>
