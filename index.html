<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
label {
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}
button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}
.delete-btn {
  width: auto;
  padding: 4px 8px;
  margin-left: 8px;
  background: #e53935;
  font-size: 12px;
}
.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
ul {
  padding-left: 18px;
}
li {
  margin-bottom: 8px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
  <label>記錄日期：</label>
  <input type="date" id="date"><br><br>

  <label>劑量：</label>
  <select id="dose">
    <option value="0.5">0.5</option>
    <option value="0.375">0.375</option>
    <option value="0.25">0.25</option>
    <option value="0.125">0.125</option>
    <option value="0">0</option>
  </select><br><br>

  <label>入睡時間（分鐘）：</label>
  <input type="number" id="latency" min="0"><br><br>

  <label>半夜醒來：</label>
  <select id="wake">
    <option value="0">0次</option>
    <option value="1">1次</option>
    <option value="2">2次以上</option>
  </select><br><br>

  <label>起床精神（1~5）：</label>
  <input type="number" id="energy" min="1" max="5" value="3"><br><br>

  <label>
    <input type="checkbox" id="supplement" style="width:auto;">
    有吃彰蜆活力
  </label><br><br>

  <label>咖啡：</label>
  <select id="coffee">
    <option value="">無</option>
    <option value="早上">早上</option>
    <option value="下午">下午</option>
    <option value="晚上">晚上</option>
  </select><br><br>

  <button onclick="saveLog()">儲存</button>
</div>

<div class="card">
  <h3>🧭 決策建議</h3>
  <div id="result" class="result"></div>
</div>

<div class="card">
  <h3>📊 分析結果</h3>
  <div id="analysis"></div>
</div>

<div class="card">
  <h3>📋 歷史紀錄</h3>
  <ul id="history"></ul>
</div>

<script>
const STORAGE_KEY = "sleepLogs";
let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

// 保護舊資料：只補缺欄位，不改 key、不清空
logs = logs.map(l => ({
  date: l.date,
  dose: Number(l.dose),
  latency: Number(l.latency),
  wake: Number(l.wake),
  energy: Number(l.energy),
  supplement: Boolean(l.supplement),
  coffee: l.coffee || ""
})).filter(l => l.date);

logs.sort((a,b) => new Date(a.date) - new Date(b.date));
localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  let input = document.getElementById("date");
  if (!input.value) {
    input.value = `${yyyy}-${mm}-${dd}`;
  }
}

function getNextDose(current) {
  const steps = [0.5, 0.375, 0.25, 0.125, 0];
  let index = steps.indexOf(Number(current));
  return index >= 0 ? steps[index + 1] : null;
}

function getScore(l) {
  let score = 0;
  if (l.latency <= 20) score++;
  if (l.wake <= 1) score++;
  if (l.energy >= 3) score++;
  return score;
}

function isStable(l) {
  return l.latency <= 20 && l.wake <= 1 && l.energy >= 3;
}

function dayDiff(prevDate, currDate) {
  const prev = new Date(prevDate + "T00:00:00");
  const curr = new Date(currDate + "T00:00:00");
  return Math.round((curr - prev) / (1000 * 60 * 60 * 24));
}

function getStableStreak() {
  if (logs.length === 0) {
    return { days: 0, dose: null, records: [] };
  }

  const last = logs[logs.length - 1];
  const dose = Number(last.dose);

  if (!isStable(last)) {
    return { days: 0, dose, records: [] };
  }

  let records = [last];

  for (let i = logs.length - 2; i >= 0; i--) {
    const prev = logs[i];
    const curr = records[0];

    if (Number(prev.dose) !== dose) break;
    if (!isStable(prev)) break;
    if (dayDiff(prev.date, curr.date) !== 1) break;

    records.unshift(prev);
  }

  return {
    days: records.length,
    dose,
    records
  };
}

function saveLog() {
  let date = document.getElementById("date").value;
  let dose = parseFloat(document.getElementById("dose").value);
  let latency = parseInt(document.getElementById("latency").value);
  let wake = parseInt(document.getElementById("wake").value);
  let energy = parseInt(document.getElementById("energy").value);
  let supplement = document.getElementById("supplement").checked;
  let coffee = document.getElementById("coffee").value;

  if (!date || isNaN(latency) || isNaN(energy)) {
    alert("請填寫完整資料");
    return;
  }

  if (energy < 1 || energy > 5) {
    alert("起床精神請填 1～5");
    return;
  }

  if (logs.some(l => l.date === date)) {
    alert("這一天已經有紀錄，請先刪除舊資料再新增。");
    return;
  }

  let log = {
    date,
    dose,
    latency,
    wake,
    energy,
    supplement,
    coffee
  };

  logs.push(log);
  logs.sort((a,b)=> new Date(a.date) - new Date(b.date));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

  alert("已儲存 👍");

  evaluate();
  analyze();
  renderHistory();
}

function deleteLog(index) {
  if (!confirm("確定要刪除這筆紀錄嗎？")) return;

  logs.splice(index, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

  evaluate();
  analyze();
  renderHistory();
}

function evaluate() {
  let result = document.getElementById("result");

  if (logs.length < 5) {
    result.innerHTML = `🟡 先累積資料（目前 ${logs.length} 天）`;
    result.className = "result warn";
    return;
  }

  const streak = getStableStreak();
  const days = streak.days;
  const dose = streak.dose;
  const records = streak.records;

  if (days < 5) {
    result.innerHTML = `
      🔴 尚未達到連續穩定條件<br>
      目前同劑量連續穩定：${days} / 5 天
    `;
    result.className = "result bad";
    return;
  }

  const hasNightCoffee = records.some(l => l.coffee === "晚上");
  const hasSupplement = records.some(l => l.supplement);
  const nextDose = getNextDose(dose);

  if (hasNightCoffee || hasSupplement) {
    result.innerHTML = `
      🟡 建議維持目前劑量<br>
      已連續穩定 ${days} 天，但有干擾因素：${hasNightCoffee ? "晚上咖啡 " : ""}${hasSupplement ? "彰蜆活力" : ""}
    `;
    result.className = "result warn";
    return;
  }

  if (nextDose === null) {
    result.innerHTML = `🟡 劑量階梯異常，請確認劑量設定`;
    result.className = "result warn";
    return;
  }

  result.innerHTML = `
    🟢 可以考慮降藥<br>
    連續穩定 ${days} 天<br>
    建議：${dose} → ${nextDose}
  `;
  result.className = "result good";
}

function analyze() {
  let analysis = document.getElementById("analysis");

  if (logs.length < 3) {
    analysis.innerHTML = "目前資料太少，至少 3 筆後才會開始分析。";
    return;
  }

  let avg = arr => arr.length
    ? arr.reduce((a,b)=>a+getScore(b),0)/arr.length
    : 0;

  let withSup = logs.filter(l => l.supplement);
  let withoutSup = logs.filter(l => !l.supplement);

  let supEffect = (withSup.length && withoutSup.length)
    ? (avg(withSup) - avg(withoutSup)).toFixed(2)
    : "資料不足";

  let coffeeTypes = ["早上","下午","晚上"];
  let coffeeResult = coffeeTypes.map(t=>{
    let arr = logs.filter(l=>l.coffee===t);
    return `${t}：${arr.length ? avg(arr).toFixed(2) + " / 3" : "資料不足"}`;
  }).join("<br>");

  analysis.innerHTML = `
    平均分數：${avg(logs).toFixed(2)} / 3<br><br>
    彰蜆活力影響：${supEffect}<br><br>
    咖啡影響：<br>${coffeeResult}
  `;
}

function renderHistory() {
  let ul = document.getElementById("history");
  ul.innerHTML = "";

  if (logs.length === 0) {
    ul.innerHTML = "<li>尚無紀錄</li>";
    return;
  }

  logs.slice().reverse().forEach((l) => {
    let originalIndex = logs.findIndex(item => item.date === l.date);

    let li = document.createElement("li");
    li.innerHTML =
      `${l.date}｜劑量:${l.dose}｜入睡:${l.latency}分｜醒:${l.wake}次｜精神:${l.energy}` +
      (l.supplement ? "｜有吃彰蜆活力" : "") +
      (l.coffee ? `｜咖啡:${l.coffee}` : "｜咖啡:無") +
      ` <button class="delete-btn" onclick="deleteLog(${originalIndex})">刪除</button>`;

    ul.appendChild(li);
  });
}

window.onload = function() {
  setDefaultDate();
  evaluate();
  analyze();
  renderHistory();
};
</script>

</body>
</html>
