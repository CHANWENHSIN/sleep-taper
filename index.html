<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戒安眠藥紀錄</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
h2 { margin-top: 0; }

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}

.result {
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
</style>
</head>

<body>

<h2>💊 戒安眠藥紀錄</h2>

<div class="card">

<label>記錄日期：</label>
<input type="date" id="date"><br><br>

<label>劑量：</label>
<select id="dose">
  <option value="0.5">0.5</option>
  <option value="0.375">0.375</option>
  <option value="0.25">0.25</option>
  <option value="0.125">0.125</option>
  <option value="0">0</option>
</select><br><br>

<label>入睡時間（分鐘）：</label>
<input type="number" id="latency"><br><br>

<label>半夜醒來：</label>
<select id="wake">
  <option value="0">0次</option>
  <option value="1">1次</option>
  <option value="2">2次以上</option>
</select><br><br>

<label>起床精神（1~5）：</label>
<input type="number" id="energy" min="1" max="5" value="3"><br><br>

<label>
<input type="checkbox" id="supplement"> 有吃彰蜆活力
</label><br><br>

<label>咖啡：</label>
<select id="coffee">
  <option value="">無</option>
  <option value="早上">早上</option>
  <option value="下午">下午</option>
  <option value="晚上">晚上</option>
</select><br><br>

<button onclick="saveLog()">儲存</button>
</div>

<div class="card">
<h3>🧭 系統判斷</h3>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>📊 歷史紀錄</h3>
<ul id="history"></ul>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("sleepLogs")) || [];

// 預設日期 = 昨天
function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);
  document.getElementById("date").value = d.toISOString().split("T")[0];
}

setDefaultDate();

// 劑量階梯
function getNextDose(current) {
  const steps = [0.5, 0.375, 0.25, 0.125, 0];
  let index = steps.indexOf(current);
  return steps[index + 1] ?? 0;
}

// 儲存
function saveLog() {
  let date = document.getElementById("date").value;
  let dose = parseFloat(document.getElementById("dose").value);
  let latency = parseInt(document.getElementById("latency").value);
  let wake = parseInt(document.getElementById("wake").value);
  let energy = parseInt(document.getElementById("energy").value);
  let supplement = document.getElementById("supplement").checked;
  let coffee = document.getElementById("coffee").value;

  if (!date || !latency || !energy) {
    alert("請填寫完整資料");
    return;
  }

  // 防呆：同一天只能一筆
  let exists = logs.some(l => l.date === date);
  if (exists) {
    alert("這一天已經有紀錄了！");
    return;
  }

  let log = {
    date,
    dose,
    latency,
    wake,
    energy,
    supplement,
    coffee
  };

  logs.push(log);
  localStorage.setItem("sleepLogs", JSON.stringify(logs));

  alert("已儲存 👍");

  evaluate();
  renderHistory();
}

// 判斷
function evaluate() {
  if (logs.length < 2) return;

  let last2 = logs.slice(-2);
  let currentDose = logs[logs.length - 1].dose;
  let nextDose = getNextDose(currentDose);

  let canReduce = last2.every(l =>
    l.latency <= 20 &&
    l.wake <= 1 &&
    l.energy >= 3
  );

  let unstable = last2.some(l =>
    l.energy <= 2 || l.latency > 40
  );

  let resultDiv = document.getElementById("result");

  if (canReduce) {
    resultDiv.innerHTML =
      `🟢 可以降藥<br>建議：${currentDose} → ${nextDose}`;
    resultDiv.className = "result good";
  } else if (unstable) {
    resultDiv.innerHTML =
      "🔴 不穩定，先不要降";
    resultDiv.className = "result bad";
  } else {
    resultDiv.innerHTML =
      "🟡 建議維持目前劑量";
    resultDiv.className = "result warn";
  }
}

// 歷史
function renderHistory() {
  let ul = document.getElementById("history");
  ul.innerHTML = "";

  logs.slice().reverse().forEach(l => {
    let li = document.createElement("li");
    li.innerText =
      `${l.date}｜劑量:${l.dose}｜入睡:${l.latency}分｜醒:${l.wake}次｜精神:${l.energy}` +
      (l.supplement ? "｜有吃彰蜆" : "") +
      (l.coffee ? `｜咖啡:${l.coffee}` : "");
    ul.appendChild(li);
  });
}

renderHistory();
evaluate();
</script>

</body>
</html>
