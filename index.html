<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
label {
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  box-sizing: border-box;
}
button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}
.result {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  line-height: 1.6;
}
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
ul {
  padding-left: 18px;
}
li {
  margin-bottom: 8px;
}
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
  <label>記錄日期：</label>
  <input type="date" id="date"><br><br>

  <label>劑量：</label>
  <select id="dose">
    <option value="0.5">0.5</option>
    <option value="0.375">0.375</option>
    <option value="0.25">0.25</option>
    <option value="0.125">0.125</option>
    <option value="0">0</option>
  </select><br><br>

  <label>入睡時間（分鐘）：</label>
  <input type="number" id="latency" min="0"><br><br>

  <label>半夜醒來：</label>
  <select id="wake">
    <option value="0">0次</option>
    <option value="1">1次</option>
    <option value="2">2次以上</option>
  </select><br><br>

  <label>起床精神（1~5）：</label>
  <input type="number" id="energy" min="1" max="5" value="3"><br><br>

  <label>
    <input type="checkbox" id="supplement" style="width:auto;">
    有吃彰蜆活力
  </label><br><br>

  <label>咖啡：</label>
  <select id="coffee">
    <option value="">無</option>
    <option value="早上">早上</option>
    <option value="下午">下午</option>
    <option value="晚上">晚上</option>
  </select><br><br>

  <button onclick="saveLog()">儲存</button>
</div>

<div class="card">
  <h3>🧭 決策建議</h3>
  <div id="result" class="result"></div>
</div>

<div class="card">
  <h3>📊 分析結果</h3>
  <div id="analysis"></div>
</div>

<div class="card">
  <h3>📋 歷史紀錄</h3>
  <ul id="history"></ul>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("sleepLogs")) || [];

// ✅ 正確設定「昨天」日期（避免時區錯誤）
function setDefaultDate() {
  let d = new Date();
  d.setDate(d.getDate() - 1);

  let yyyy = d.getFullYear();
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let dd = String(d.getDate()).padStart(2, '0');

  let input = document.getElementById("date");
  if (!input.value) {
    input.value = `${yyyy}-${mm}-${dd}`;
  }
}

// 劑量階梯
function getNextDose(current) {
  const steps = [0.5, 0.375, 0.25, 0.125, 0];
  let index = steps.indexOf(current);
  return steps[index + 1] ?? 0;
}

// 睡眠分數
function getScore(l) {
  let score = 0;
  if (l.latency <= 20) score++;
  if (l.wake <= 1) score++;
  if (l.energy >= 3) score++;
  return score;
}

// 儲存
function saveLog() {
  let date = document.getElementById("date").value;
  let dose = parseFloat(document.getElementById("dose").value);
  let latency = parseInt(document.getElementById("latency").value);
  let wake = parseInt(document.getElementById("wake").value);
  let energy = parseInt(document.getElementById("energy").value);
  let supplement = document.getElementById("supplement").checked;
  let coffee = document.getElementById("coffee").value;

  if (!date || isNaN(latency) || isNaN(energy)) {
    alert("請填寫完整資料");
    return;
  }

  if (logs.some(l => l.date === date)) {
    alert("這一天已經有紀錄");
    return;
  }

  let log = { date, dose, latency, wake, energy, supplement, coffee };

  logs.push(log);
  logs.sort((a,b)=> new Date(a.date) - new Date(b.date));

  localStorage.setItem("sleepLogs", JSON.stringify(logs));

  alert("已儲存 👍");

  evaluate();
  analyze();
  renderHistory();
}

// 決策
function evaluate() {
  let result = document.getElementById("result");

  if (logs.length < 7) {
    result.innerHTML = `🟡 先累積資料（目前 ${logs.length} 天）`;
    result.className = "result warn";
    return;
  }

  let currentDose = logs[logs.length - 1].dose;
  let sameDoseLogs = logs.filter(l => l.dose === currentDose);
  let recent = sameDoseLogs.slice(-5);

  if (recent.length < 5) {
    result.innerHTML = `🟡 同劑量觀察不足（${recent.length}/5天）`;
    result.className = "result warn";
    return;
  }

  let stable = recent.every(l =>
    l.latency <= 20 &&
    l.wake <= 1 &&
    l.energy >= 3
  );

  let unstable = recent.some(l =>
    l.energy <= 2 || l.latency > 40 || l.wake >= 2
  );

  let badHabit = recent.some(l =>
    l.coffee === "晚上" || l.supplement
  );

  let next = getNextDose(currentDose);

  if (unstable) {
    result.innerHTML = "🔴 不穩定，先不要降";
    result.className = "result bad";
  } else if (stable && !badHabit) {
    result.innerHTML = `🟢 可以降藥：${currentDose} → ${next}`;
    result.className = "result good";
  } else {
    result.innerHTML = "🟡 建議維持（有干擾因素）";
    result.className = "result warn";
  }
}

// 分析
function analyze() {
  if (logs.length < 3) return;

  let avg = arr => arr.reduce((a,b)=>a+getScore(b),0)/arr.length || 0;

  let withSup = logs.filter(l => l.supplement);
  let withoutSup = logs.filter(l => !l.supplement);

  let supEffect = (withSup.length && withoutSup.length)
    ? (avg(withSup) - avg(withoutSup)).toFixed(2)
    : "資料不足";

  let coffeeTypes = ["早上","下午","晚上"];
  let coffeeResult = coffeeTypes.map(t=>{
    let arr = logs.filter(l=>l.coffee===t);
    return `${t}：${arr.length?avg(arr).toFixed(2):"資料不足"}`;
  }).join("<br>");

  document.getElementById("analysis").innerHTML = `
  平均分數：${avg(logs).toFixed(2)} / 3<br><br>
  彰蜆活力影響：${supEffect}<br><br>
  咖啡影響：<br>${coffeeResult}
  `;
}

// 歷史
function renderHistory() {
  let ul = document.getElementById("history");
  ul.innerHTML = "";

  logs.slice().reverse().forEach(l=>{
    let li = document.createElement("li");
    li.innerText =
      `${l.date}｜劑量:${l.dose}｜入睡:${l.latency}｜醒:${l.wake}｜精神:${l.energy}` +
      (l.supplement?"｜彰蜆":"") +
      (l.coffee?`｜咖啡:${l.coffee}`:"");
    ul.appendChild(li);
  });
}

// 初始化
window.onload = function() {
  setDefaultDate();
  evaluate();
  analyze();
  renderHistory();
};
</script>

</body>
</html>
