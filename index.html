<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠決策中心</title>

<style>
body { font-family: Arial; background: #f5f5f5; padding: 15px; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
.result { font-size: 20px; font-weight: bold; text-align: center; }
.good { color: green; }
.warn { color: orange; }
.bad { color: red; }
</style>
</head>

<body>

<h2>💊 睡眠決策中心</h2>

<div class="card">
<label>日期：</label>
<input type="date" id="date"><br><br>

<label>劑量：</label>
<select id="dose">
  <option value="0.5">0.5</option>
  <option value="0.375">0.375</option>
  <option value="0.25">0.25</option>
  <option value="0.125">0.125</option>
  <option value="0">0</option>
</select><br><br>

<label>入睡時間（分鐘）：</label>
<input type="number" id="latency"><br><br>

<label>醒來次數：</label>
<select id="wake">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2+</option>
</select><br><br>

<label>精神（1~5）：</label>
<input type="number" id="energy"><br><br>

<label><input type="checkbox" id="supplement"> 有吃彰蜆活力</label><br><br>

<label>咖啡：</label>
<select id="coffee">
  <option value="">無</option>
  <option value="早上">早上</option>
  <option value="下午">下午</option>
  <option value="晚上">晚上</option>
</select><br><br>

<button onclick="saveLog()">儲存</button>
</div>

<div class="card">
<h3>🧭 決策建議</h3>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>📊 分析結果</h3>
<div id="analysis"></div>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("sleepLogs")) || [];

// 劑量階梯
function getNextDose(current) {
  const steps = [0.5, 0.375, 0.25, 0.125, 0];
  let index = steps.indexOf(current);
  return steps[index + 1] ?? 0;
}

// 睡眠分數
function getScore(l) {
  let score = 0;
  if (l.latency <= 20) score++;
  if (l.wake <= 1) score++;
  if (l.energy >= 3) score++;
  return score;
}

// 儲存
function saveLog() {
  let date = dateInput.value;

  if (!date) {
    alert("請選日期");
    return;
  }

  if (logs.some(l => l.date === date)) {
    alert("這一天已經有紀錄");
    return;
  }

  let log = {
    date,
    dose: parseFloat(dose.value),
    latency: parseInt(latency.value),
    wake: parseInt(wake.value),
    energy: parseInt(energy.value),
    supplement: supplement.checked,
    coffee: coffee.value
  };

  logs.push(log);
  localStorage.setItem("sleepLogs", JSON.stringify(logs));

  evaluate();
  analyze();
}

// ⭐ 決策引擎
function evaluate() {
  if (logs.length < 3) {
    result.innerHTML = "📊 資料不足（至少3筆）";
    result.className = "result warn";
    return;
  }

  let last2 = logs.slice(-2);
  let currentDose = logs[logs.length - 1].dose;
  let nextDose = getNextDose(currentDose);

  let stable = last2.every(l =>
    l.latency <= 20 &&
    l.wake <= 1 &&
    l.energy >= 3
  );

  let unstable = last2.some(l =>
    l.energy <= 2 ||
    l.latency > 40 ||
    l.wake >= 2
  );

  let hasBadHabit = last2.some(l =>
    l.coffee === "晚上"
  );

  if (unstable) {
    result.innerHTML = "🔴 不穩定，先不要降";
    result.className = "result bad";
  } else if (stable && !hasBadHabit) {
    result.innerHTML =
      `🟢 可以降藥<br>建議：${currentDose} → ${nextDose}`;
    result.className = "result good";
  } else {
    result.innerHTML = "🟡 維持目前劑量";
    result.className = "result warn";
  }
}

// 📊 分析
function analyze() {
  if (logs.length < 3) return;

  let avg = arr =>
    arr.reduce((a,b)=>a+getScore(b),0)/arr.length || 0;

  let withSup = logs.filter(l => l.supplement);
  let withoutSup = logs.filter(l => !l.supplement);

  let supEffect = avg(withSup) - avg(withoutSup);

  let coffeeMap = {早上:[], 下午:[], 晚上:[]};

  logs.forEach(l => {
    if (l.coffee) coffeeMap[l.coffee].push(l);
  });

  let coffeeResult = Object.entries(coffeeMap)
    .map(([k,v]) => `${k}: ${avg(v).toFixed(2)}`)
    .join("<br>");

  analysis.innerHTML = `
  📌 平均睡眠分數：${avg(logs).toFixed(2)} / 3 <br><br>
  📌 彰蜆活力影響：${supEffect.toFixed(2)} <br><br>
  📌 咖啡影響：<br>${coffeeResult}
  `;
}

evaluate();
analyze();
</script>

</body>
</html>
